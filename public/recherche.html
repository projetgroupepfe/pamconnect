<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PamConnect - Recherche</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <a href="/index.html">Accueil</a>
    <a href="/employeur.html">Espace employeur</a>
    <a href="/prestataire.html">Espace prestataire</a>
    <a href="/recherche.html">Recherche</a>
    <a href="/inscription.html">Inscription</a>
    <a href="/connexion.html">Connexion</a>
    <a href="/mon-profil">Mon profil</a>
  </nav>

  <h1>Rechercher un prestataire</h1>

  <form id="formulaireRecherche" action="/recherche" method="GET">
    <label for="metier">Métier recherché :</label>
    <input type="text" id="metier" name="metier" placeholder="ex: menage">

    <input type="hidden" id="latitude" name="latitude">
    <input type="hidden" id="longitude" name="longitude">

    <button type="submit">Rechercher près de moi</button>
  </form>

  <script>
  const formulaire = document.getElementById("formulaireRecherche");

  formulaire.addEventListener("submit", function (evenement) {
    evenement.preventDefault();

    if (!navigator.geolocation) {
      alert("La géolocalisation n'est pas disponible sur cet appareil.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (position) {
        document.getElementById("latitude").value = position.coords.latitude;
        document.getElementById("longitude").value = position.coords.longitude;
        formulaire.submit();
      },
      function (erreur) {
        alert("Impossible d'obtenir ta position : " + erreur.message);
      }
    );
  });
</script>
</body>
</html>
